<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>错题本</title>
    <link rel="stylesheet" href="./styles.css?v=20260628-avatar3" />
  </head>
  <body>
    <div class="auth-screen" id="authScreen">
      <form class="auth-card" id="authForm">
        <div class="auth-brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark-paper"></span>
            <span class="brand-mark-check"></span>
          </span>
          <div>
            <h1 id="authTitle">登录错题本</h1>
            <p id="authHint">使用邮箱和密码登录你的云端题库</p>
          </div>
        </div>

        <label>
          邮箱
          <input id="authUsername" type="email" autocomplete="email" required />
        </label>

        <label>
          密码
          <input id="authPassword" type="password" autocomplete="current-password" required />
        </label>

        <button type="submit" id="authSubmit">登录</button>
        <button class="auth-mode-toggle" type="button" id="authModeToggle">注册新账号</button>
        <p class="auth-message" id="authMessage"></p>
      </form>
    </div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="错题目录">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-mark-paper"></span>
            <span class="brand-mark-check"></span>
          </span>
          <div>
            <h1>错题本</h1>
            <p>按目录收纳题目与解析</p>
          </div>
        </div>

        <div class="filter-group">
          <label for="categoryFilter">科目大类</label>
          <select id="categoryFilter"></select>
        </div>

        <div class="filter-group">
          <label for="subjectFilter">学科</label>
          <select id="subjectFilter"></select>
        </div>

        <div class="filter-group">
          <label for="typeFilter">题型 / 目录</label>
          <select id="typeFilter"></select>
        </div>

        <button class="primary-action" id="openManager" type="button">新增学科 / 题型</button>

        <div class="profile-mark" aria-label="个人标识">
          <button class="avatar-button" id="avatarButton" type="button" aria-label="更换个人头像" title="更换个人头像">
            <img id="profileAvatar" alt="个人头像" />
          </button>
          <div class="backup-menu" id="backupMenu">
            <button class="logout-button" id="toggleBackupMenu" type="button" aria-expanded="false">导入导出</button>
            <div class="backup-menu-panel" aria-label="题库导入导出选项">
              <button class="backup-menu-item" id="exportBackup" type="button">导出题库 JSON</button>
              <button class="backup-menu-item" id="overwriteImportBackup" type="button">覆盖导入 JSON</button>
              <button class="backup-menu-item" id="mergeImportBackup" type="button">合并导入 JSON</button>
            </div>
          </div>
          <input id="avatarFileInput" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden />
          <input id="backupFileInput" type="file" accept="application/json,.json" hidden />
          <button class="logout-button" id="logoutButton" type="button">退出</button>
        </div>
      </aside>

      <main class="main-content">
        <section class="topbar" aria-label="当前目录">
          <div>
            <p class="eyebrow">Current Folder</p>
            <h2 id="currentPath">全部错题</h2>
          </div>
          <div class="stats" id="stats"></div>
          <button class="toggle-owner-button" id="toggleOwnerIds" type="button">显示ID</button>
        </section>

        <section class="quick-add" aria-label="新增错题">
          <button class="add-question-button" id="openPasteDialog" type="button" aria-label="新增错题">+</button>
        </section>

        <nav class="subject-tabs" id="subjectTabs" aria-label="学科快捷筛选"></nav>

        <section class="question-list" id="questionList" aria-live="polite"></section>

        <nav class="pagination" id="pagination" aria-label="错题翻页"></nav>
      </main>
    </div>

    <template id="questionTemplate">
      <article class="question-card">
        <header class="question-header">
          <div>
            <div class="meta-row"></div>
            <h3></h3>
          </div>
          <div class="question-actions"></div>
        </header>

        <section class="card-section question-section">
          <div class="section-heading">
            <span class="section-label">题目截图</span>
          </div>
          <div class="media-block question-media"></div>
        </section>

        <details class="answer-panel">
          <summary>
            <span>答案与解析</span>
            <span class="summary-hint">点击展开</span>
          </summary>
          <div class="answer-content">
            <div class="full-question-content">
              <div class="section-heading">
                <span class="section-label">完整题目截图</span>
              </div>
              <div class="full-question-media"></div>
            </div>

            <div class="section-heading">
              <span class="section-label">解析截图</span>
            </div>
            <div class="answer-media"></div>

            <div class="note-editor">
              <label>
                <span class="note-header">
                  <span class="section-label">我的备注</span>
                  <span class="note-save-status">已保存</span>
                  <button class="finish-note-button" type="button" title="完成备注" aria-label="完成备注">✓</button>
                </span>
                <textarea class="question-note" placeholder="写下自己的看法、易错点或复盘结论"></textarea>
              </label>
            </div>
          </div>
        </details>
      </article>
    </template>

    <dialog class="manager-dialog" id="managerDialog">
      <div class="manager-panel">
        <header class="manager-header">
          <div>
            <p class="eyebrow">Manage Folders</p>
            <h2>管理模块</h2>
          </div>
          <button class="icon-button" id="closeManager" type="button" aria-label="关闭">×</button>
        </header>

        <section class="manager-section">
          <h3>科目大类</h3>
          <div class="module-list" id="categoryList"></div>
        </section>

        <section class="manager-section">
          <h3>新增学科</h3>
          <form class="inline-form subject-form" id="subjectForm">
            <select id="subjectCategory"></select>
            <input id="newSubject" type="text" placeholder="例如：线性代数、操作系统" required />
            <button type="submit">添加学科</button>
          </form>
          <div class="module-list" id="subjectList"></div>
        </section>

        <section class="manager-section">
          <h3>新增题型 / 目录</h3>
          <form class="inline-form folder-form" id="typeForm">
            <select id="typeCategory"></select>
            <select id="typeSubject"></select>
            <input id="newType" type="text" placeholder="例如：一元函数微分学、Cache、证明题" required />
            <button type="submit">添加目录</button>
          </form>
          <div class="module-list" id="typeList"></div>
        </section>
      </div>
    </dialog>

    <dialog class="manager-dialog" id="pasteDialog">
      <div class="manager-panel">
        <header class="manager-header">
          <div>
            <p class="eyebrow">Paste PNG</p>
            <h2>新增错题</h2>
            <p class="dialog-path" id="pastePath"></p>
          </div>
          <button class="icon-button" id="closePasteDialog" type="button" aria-label="关闭">×</button>
        </header>

        <section class="paste-grid">
          <div class="paste-box" id="questionPasteBox" tabindex="0">
            <strong>题目截图</strong>
            <span>点击这里后粘贴 PNG</span>
            <div class="paste-preview" id="questionPreview"></div>
          </div>

          <div class="paste-box" id="answerPasteBox" tabindex="0">
            <strong>解析截图</strong>
            <span>点击这里后粘贴 PNG</span>
            <div class="paste-preview" id="answerPreview"></div>
          </div>
        </section>

        <label class="paste-note-field">
          <strong>我的备注</strong>
          <textarea id="pasteNote" placeholder="可选：写下自己的看法、易错点或复盘结论"></textarea>
        </label>

        <div class="paste-actions">
          <button class="ghost-button" id="clearPaste" type="button">清空</button>
          <button class="form-submit" id="savePastedQuestion" type="button">保存错题</button>
        </div>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=20260628-cloud"></script>
    <script src="./questions.js"></script>
    <script src="./storage.js?v=20260628-avatar3"></script>
    <script src="./ui-utils.js?v=20260628-avatar3"></script>
    <script src="./app.js?v=20260628-avatar3"></script>
  </body>
</html>
